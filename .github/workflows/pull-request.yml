name: Find By Color - Pull Request
on:
  pull_request:
    branches:
      - main
      - staging
      - develop
jobs:
  build_and_test:
    name: Build Application and Run Tests
    runs-on: [self-hosted, linux, X64]
    strategy:
      matrix:
        node-version: [14.x]
    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test

    - name: Clean Up Build Files
      run: rm -fr /findbycolor/actions-runner/_work/findbycolor-website/microdata-extractor/{*,.*} > /dev/null 2>&1 &
